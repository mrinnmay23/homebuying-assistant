<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mortgage Chatbot</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
    />
    <style>
        body{
            background: url('/images/background2.jpg') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="bg-light">

<!-- transparent navbar (kept as-is) -->
<nav class="navbar navbar-expand-lg bg-transparent mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Homebuying Assistant</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/chat}">Chat</a>
            <a class="nav-link" th:href="@{/quotes}">Quotes</a>
            <a class="nav-link" th:href="@{/calculator}">Calculator</a>
        </div>
    </div>
</nav>

<div class="container">
    <a th:href="@{/}" class="btn btn-outline-secondary mb-3">← Home</a>
    <h1 class="mb-4">Mortgage Chatbot</h1>

    <!-- translucent panel -->
    <div class="p-4 mb-4 bg-white bg-opacity-75 rounded shadow-sm">

        <!-- avatar GIF (optional) -->
        <div class="text-center mb-4">
            <img th:src="@{/images/chatbot.gif}" alt="Chatbot Avatar"
                 class="img-fluid" style="max-height: 160px;" />
        </div>

        <!-- ADDED: PDF upload to feed the chat context -->
        <form id="pdf-form" enctype="multipart/form-data" class="row g-2 mb-4">
        <div class="col">
                <input class="form-control" type="file" name="file" accept="application/pdf" required />
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-primary" type="submit">Attach PDF to Chat</button>
            </div>
        </form>

        <!-- Index library button (optional/admin) -->
        <button id="indexBtn" type="button" class="btn btn-outline-secondary btn-sm mb-3">
            Index Library
        </button>



        <!-- chat input -->
        <form id="chat-form" class="row g-2 mb-3">
            <div class="col">
                <input type="text" id="msg" class="form-control"
                       placeholder="Type your question…" autocomplete="off" />
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Send</button>
                <!-- NEW: the green button -->
            </div>
        </form>


<!--        &lt;!&ndash; VOICE AREA &ndash;&gt;-->
<!--        <div class="d-flex align-items-center gap-2 mt-2">-->

<!--            <small id="mic-status" class="text-muted">idle</small>-->

        <!-- VOICE (live mic only) -->
        <div class="d-flex align-items-center gap-2 mt-2">
            <button id="mic-btn" type="button" class="btn btn-outline-danger">🎤 Record</button>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="voice-llm" checked>
                <label class="form-check-label" for="voice-llm">Use LLM end-to-end</label>
            </div>
            <small id="mic-status" class="text-muted">idle</small>
        </div>


        <!-- Captions (what the mic heard) -->
        <div id="captions" class="alert alert-secondary d-none small mb-2"></div>

        <!-- TTS toggle -->
        <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="ttsToggle">
            <label class="form-check-label" for="ttsToggle">🔊 Read bot replies</label>

            <input class="form-check-input" type="checkbox" id="myLibToggle">

        </div>



        <!-- chat log -->
        <div id="log" class="border rounded p-3"
             style="height: 320px; overflow-y: auto; background:#f8f9fa;"></div>

    </div>
</div>

    async function sendTextToBot(msg) {
        const useLib = document.getElementById('myLibToggle')?.checked;
        const url  = useLib ? '/api/rag/ask' : '/api';
        const bodyPayload = useLib ? { q: msg } : { message: msg };

        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyPayload)
        });

        return await resp.json();
    }

    // ---------- PDF TO CHAT CONTEXT: POST /api/pdf/upload-to-chat ----------
    document.getElementById('pdf-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        say('You', '[uploaded a PDF]');
        const fd = new FormData(e.target);

        const resp = await fetch(/*[[ @{/api/pdf/upload-to-chat} ]]*/, {
            method: 'POST',
            body: fd
        });
        const json = await resp.json();

        if (json.error) {
            say('Bot', `<span class="text-danger">${json.error}</span>`);
            return;
        }

        const n = json.normalized || {};
        const have = [
            n.principal != null ? `amount=$${n.principal}` : null,
            n.rate != null ? `rate=${n.rate}%` : null,
            n.termYears != null ? `term=${n.termYears}y` : null,
            n.fees != null ? `fees=$${n.fees}` : null
        ].filter(Boolean).join(', ');

        say('Bot', json.reply || 'PDF processed.');

        // Tiny confirmation line: which fields Gemini found
        const checks = [
            n.principal != null ? "amount ✓" : "amount –",
            n.rate != null ? "rate ✓" : "rate –",
            n.termYears != null ? "term ✓" : "term –",
            n.fees != null ? "fees ✓" : "fees –"
        ].join("  ");
        say('Bot', `Read via Gemini: ${checks}`);


        if (have) say('Bot', `Saved from PDF → ${have}`);
        e.target.reset();
    });

    function ttsOn(){ return document.getElementById('ttsToggle')?.checked; }

    function stopRec() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        } else {
            say('Bot', '<span class="text-danger">No active recording. Click Record first.</span>');
        }
        micBtn.classList.add('btn-outline-danger');
        micBtn.classList.remove('btn-danger');
        micBtn.textContent = '🎤 Record';
        micStatus.textContent = 'processing…';
    }

    function cleanupStream() {
        if (streamRef) {
            streamRef.getTracks().forEach(t => t.stop());
            streamRef = null;
        }
    }

    micBtn.addEventListener('click', () => {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') startRec();
        else stopRec();
    });

    function showCaptions(text){
        const el = document.getElementById('captions');
        if (!text) { el.classList.add('d-none'); el.textContent = ''; return; }
        el.textContent = `Heard: ${text}`;
        el.classList.remove('d-none');
    }

    async function speak(text) {
        if (!text) return;

        // remove HTML tags
        const clean = String(text).replace(/<[^>]+>/g, ' ');

        const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: clean, languageCode: 'en-US' })
        });

        if (!res.ok) {
            console.error('TTS failed', await res.text());
            return;
        }

        const buf = await res.arrayBuffer();
        const url = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));

        const audio = new Audio(url);
        await audio.play();
    }
