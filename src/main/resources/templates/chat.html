<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mortgage Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <style>
        body{
            background: url('/images/background2.jpg') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-transparent mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Homebuying Assistant</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/chat}">Chat</a>
            <a class="nav-link" th:href="@{/quotes}">Quotes</a>
            <a class="nav-link" th:href="@{/calculator}">Calculator</a>
        </div>
    </div>
</nav>

<div class="container">
    <a th:href="@{/}" class="btn btn-outline-secondary mb-3">← Home</a>
    <h1 class="mb-4">Mortgage Chatbot</h1>

    <div class="p-4 mb-4 bg-white bg-opacity-75 rounded shadow-sm">

        <div class="text-center mb-4">
            <img th:src="@{/images/chatbot.gif}" alt="Chatbot Avatar" class="img-fluid" style="max-height:160px;" />
        </div>

        <!-- PDF upload + compare toggle -->
        <form id="pdf-form" enctype="multipart/form-data" class="row g-2 mb-3">
            <div class="col">
                <input class="form-control" type="file" name="file" accept="application/pdf" required />
            </div>
            <div class="col-auto form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" id="compareToggle">
                <label class="form-check-label" for="compareToggle">Compare with Gemini</label>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-primary" type="submit">Attach PDF to Chat</button>
            </div>
        </form>

        <!-- Chat input -->
        <form id="chat-form" class="row g-2 mb-3">
            <div class="col">
                <input type="text" id="msg" class="form-control" placeholder="Type your question…" autocomplete="off" />
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Send</button>
            </div>
        </form>

        <!-- Chat log -->
        <div id="log" class="border rounded p-3" style="height:320px; overflow-y:auto; background:#f8f9fa;"></div>

        <!-- Comparison zone -->
        <div id="compareZone" class="mt-3"></div>

    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const log = document.getElementById('log');
    const compareZone = document.getElementById('compareZone');

    function say(who, html){
        const line = document.createElement('div');
        line.innerHTML = `<strong>${who}:</strong> ${html}`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    // ----- CHAT: POST /api -----
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg').value.trim();
        if (!msg) return;
        say('You', msg);

        const resp = await fetch(/*[[ @{/api} ]]*/, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const body = await resp.json();

        if (body.reply) {
            say('Bot', body.reply);
        } else if (body.monthlyPayment) {
            say('Bot', `Monthly payment: $${Number(body.monthlyPayment).toFixed(2)}`);
        } else if (body.percentile) {
            say('Bot', `Your offer is at the ${Number(body.percentile).toFixed(1)}th percentile.`);
        } else if (body.quotes) {
            say('Bot', 'Here are your quotes:');
            const ul = document.createElement('ul');
            ul.style.marginTop = '6px';
            (body.quotes || []).forEach(q => {
                const li = document.createElement('li');
                li.textContent = `Rate ${q.rate}% | Fees ${q.fees} | Score range ${q.minScore}-${q.maxScore}`;
                ul.appendChild(li);
            });
            log.appendChild(ul);
            log.scrollTop = log.scrollHeight;
        } else if (body.schedule) {
            say('Bot', 'Amortization (first 5 years):');
            const first = (body.schedule || []).slice(0,5);
            const table = document.createElement('table');
            table.className = 'table table-sm';
            table.innerHTML = `
      <thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
      <tbody>
        ${first.map(r => `
          <tr>
            <td>${r.year}</td>
            <td>${r.principalPaid}</td>
            <td>${r.interestPaid}</td>
            <td>${r.remainingBalance}</td>
          </tr>`).join('')}
      </tbody>`;
            log.appendChild(table);
            log.scrollTop = log.scrollHeight;
        } else if (body.refinance) {
            const r = body.refinance;
            say('Bot', `Old: $${r.oldPayment} → New: $${r.newPayment} | Save $${r.monthlySavings}/mo | Should refinance? ${r.shouldRefinance ? 'Yes' : 'No'}`);
        } else if (body.agent) {
            const a = body.agent;
            const card = document.createElement('div');
            card.className = 'card mb-2';
            card.innerHTML = `
      <div class="card-body d-flex align-items-center gap-3">
        ${a.imageFilename ? `<img src="/images/${a.imageFilename}" alt="${a.name}" class="rounded-circle" style="width:64px;height:64px;object-fit:cover;">` : ''}
        <div>
          <div class="fw-semibold">${a.name} (ID ${a.id})</div>
          <div>
            <a href="mailto:${a.email}">${a.email}</a>
            &nbsp;·&nbsp;
            <a href="tel:${a.phone}">${a.phone}</a>
          </div>
        </div>
      </div>`;
            log.appendChild(card);
            log.scrollTop = log.scrollHeight;
        } else {
            say('Bot', `<pre class="mb-0">${JSON.stringify(body, null, 2)}</pre>`);
        }

        document.getElementById('msg').value = '';
    });

    // ----- PDF TO CHAT CONTEXT: POST /api/pdf/upload-to-chat -----
    document.getElementById('pdf-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        say('You', '[uploaded a Loan Estimate PDF]');
        const fd = new FormData(e.target);
        if (document.getElementById('compareToggle').checked) fd.append('compare','true');

        const resp = await fetch(/*[[ @{/api/pdf/upload-to-chat} ]]*/, { method: 'POST', body: fd });
        const json = await resp.json();

        if (json.error) {
            say('Bot', `<span class="text-danger">${json.error}</span>`);
            return;
        }
        if (json.geminiError) {
            say('Bot', `<span class="text-danger">Gemini error: ${escapeHtml(json.geminiError)}</span>`);
        }


        say('Bot', json.reply || 'PDF processed.');
        const n = json.normalized || {};
        const have = [
            n.principal != null ? `amount=$${n.principal}` : null,
            n.rate != null ? `rate=${n.rate}%` : null,
            n.termYears != null ? `term=${n.termYears}y` : null,
            n.fees != null ? `fees=$${n.fees}` : null
        ].filter(Boolean).join(', ');
        if (have) say('Bot', `Saved from PDF → ${have}`);

        renderComparison(json);
        e.target.reset();
    });

    // ----- Compare table + choose -----
    function renderComparison(payload){
        compareZone.innerHTML = '';
        if (!payload.compare) return;

        const docai = payload.docai || {};
        const gemini = payload.gemini || {};
        const finalF = payload.final || {};
        const src = payload.sources || {};

        const rows = [
            ["loanAmount","Loan Amount"],
            ["interestRate","Interest Rate"],
            ["termYears","Term (years)"],
            ["fees","Fees / Closing Costs"]
        ];

        const el = document.createElement('div');
        el.className = 'card card-body';
        el.innerHTML = `
    <h6 class="mb-3">DocAI vs Gemini (click to choose)</h6>
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr><th>Field</th><th>DocAI</th><th>Gemini</th><th>Final</th></tr></thead>
        <tbody>
          ${rows.map(([key,label]) => {
            const docVal = pick(docai, key);
            const gemVal = pick(gemini, key);
            return `
              <tr>
                <td>${label}</td>
                <td>
                  ${escapeHtml(docVal || '-')}
                  <button type="button" class="btn btn-link btn-sm" data-field="${key}" data-use="docai" ${docVal ? '' : 'disabled'}>Use</button>
                </td>
                <td>
                  ${escapeHtml(gemVal || '-')}
                  <button type="button" class="btn btn-link btn-sm" data-field="${key}" data-use="gemini" ${gemVal ? '' : 'disabled'}>Use</button>
                </td>
                <td>
                  <span id="final-${key}">${escapeHtml(finalF[key] || '-')}</span>
                  <small class="text-muted">(${src[key] || '-'})</small>
                </td>
              </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
        compareZone.appendChild(el);

        el.querySelectorAll('button[data-field]').forEach(btn=>{
            btn.addEventListener('click', async ()=>{
                if (btn.disabled) return;                     // guard
                const field = btn.getAttribute('data-field');
                const use = btn.getAttribute('data-use');
                try {
                    const resp = await fetch(/*[[ @{/api/pdf/choose} ]]*/, {
                        method: 'POST',
                        headers: {'Content-Type':'application/x-www-form-urlencoded'},
                        body: new URLSearchParams({field, use})
                    });
                    const j = await resp.json();
                    if (!resp.ok || !j.ok) {
                        say('Bot', `<span class="text-danger">Choose failed (${resp.status}): ${escapeHtml(j.error || 'unknown')}</span>`);
                        return;
                    }
                    document.getElementById('final-'+field).textContent = j.final[field] || '-';
                } catch (err) {
                    say('Bot', `<span class="text-danger">Choose crashed: ${escapeHtml(err.message || String(err))}</span>`);
                }
            });
        });
    }



    function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
    function pickFlex(map, keys){
        if (!map) return null;
        const nm = {};
        for (const real in map) nm[norm(real)] = map[real];
        for (const k of keys){
            const nk = norm(k);
            for (const ek in nm) if (ek===nk || ek.includes(nk) || nk.includes(ek)) return nm[ek];
        }
        return null;
    }
    function pick(map, key){
        const ksets = {
            loanAmount:  ["Loan Amount","Amount Financed","Loan Amount (A)","Total Loan Amount","loanamount","amount financed"],
            interestRate:["Interest Rate","Rate","APR","Annual Percentage Rate","interest rate","apr","interestrate"],

            termYears:   ["Loan Term","Years","Term","Term (years)","loan term","term (yr)","years"],
            fees: [
                "Fees","Closing Costs","Estimated Closing Costs","Total Closing Costs",
                "Total Estimated Closing Costs","Total Loan Costs",
                "Section J Closing Costs","Total Closing Costs (J)","closing costs","fees"
            ]
        };
        return pickFlex(map, ksets[key] || []);
    }


    function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    /*]]>*/
</script>

</body>
</html>
